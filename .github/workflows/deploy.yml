name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  NODE_VERSION: "18"
  BUILD_DIR: "dist"

jobs:
  build:
    name: Build Assets
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm ci --prefer-offline --no-audit
        env:
          NODE_ENV: production
      
      - name: Validate HTML
        run: |
          npm run validate:html
        continue-on-error: false
      
      - name: Run linters
        run: |
          npm run lint:css
          npm run lint:js
        continue-on-error: false
      
      - name: Clean build directory
        run: npm run clean
      
      - name: Build CSS
        run: npm run build:css
        env:
          NODE_ENV: production
      
      - name: Build JavaScript
        run: npm run build:js
        env:
          NODE_ENV: production
      
      - name: Build HTML
        run: npm run build:html
        env:
          NODE_ENV: production
      
      - name: Optimize images
        run: npm run optimize:images
        continue-on-error: true
      
      - name: Copy static assets
        run: npm run build:assets
      
      - name: Verify build output
        run: |
          echo "Verifying build artifacts..."
          
          if [ ! -d "${{ env.BUILD_DIR }}" ]; then
            echo "Error: Build directory does not exist"
            exit 1
          fi
          
          if [ ! -f "${{ env.BUILD_DIR }}/index.html" ]; then
            echo "Error: index.html not found in build directory"
            exit 1
          fi
          
          if [ ! -d "${{ env.BUILD_DIR }}/css" ]; then
            echo "Error: CSS directory not found"
            exit 1
          fi
          
          if [ ! -d "${{ env.BUILD_DIR }}/js" ]; then
            echo "Error: JavaScript directory not found"
            exit 1
          fi
          
          echo "Build verification successful"
          
          echo "Build contents:"
          find ${{ env.BUILD_DIR }} -type f -exec ls -lh {} \;
      
      - name: Calculate build metrics
        run: |
          echo "### Build Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          CSS_SIZE=$(find ${{ env.BUILD_DIR }}/css -name "*.css" -type f -exec du -ch {} + | grep total | awk '{print $1}')
          JS_SIZE=$(find ${{ env.BUILD_DIR }}/js -name "*.js" -type f -exec du -ch {} + | grep total | awk '{print $1}')
          TOTAL_SIZE=$(du -sh ${{ env.BUILD_DIR }} | awk '{print $1}')
          
          echo "- **Total Build Size:** $TOTAL_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **CSS Size:** $CSS_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **JavaScript Size:** $JS_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Time:** ${{ job.duration }}s" >> $GITHUB_STEP_SUMMARY
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: ${{ env.BUILD_DIR }}
          retention-days: 7
          if-no-files-found: error
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_DIR }}
  
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      
      - name: Verify deployment
        run: |
          echo "Deployment URL: ${{ steps.deployment.outputs.page_url }}"
          
          MAX_RETRIES=10
          RETRY_DELAY=10
          
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i: Checking deployment health..."
            
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.deployment.outputs.page_url }}" || echo "000")
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Deployment verified successfully"
              exit 0
            fi
            
            echo "⚠️  Health check returned HTTP $HTTP_CODE, retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done
          
          echo "❌ Deployment verification failed after $MAX_RETRIES attempts"
          exit 1
      
      - name: Post deployment summary
        if: always()
        run: |
          echo "### Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
